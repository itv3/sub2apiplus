name: CI

on:
  push:
    branches:
      - main
      # 上游合并 U-4 的候选分支：本机没有 Docker 时，integration 证据由这里的 CI 按候选提交补齐。
      - 'upstream-merge/**'
  pull_request:
  # 发版回写 VERSION 由 GITHUB_TOKEN 推送，不会触发 push；release 工作流回写成功后以此显式调起一次 CI。
  workflow_dispatch:
    inputs:
      capture_executor:
        description: '采集测试执行器；legacy 用于显式回退'
        type: choice
        default: unified
        options: [unified, legacy]
      capture_bytecode_cache:
        description: 'CI 作业内字节码共享；off 用于显式回退'
        type: choice
        default: auto
        options: [auto, off]
      capture_identity_memo:
        description: 'CI 作业内身份记忆化；off 用于独立回退'
        type: choice
        default: auto
        options: [auto, off]

permissions:
  contents: read

jobs:
  # 2026-09-28：保持全量、分 4 片并行（tools/ci/capture_test_shards.py 与 make test-capture-tools 同一 discover 语义；
  # 每片先做闭合自检：并集＝全量、互不相交、权重表无陈旧条目）。
  capture-tools:
    runs-on: ubuntu-latest
    env:
      CAPTURE_TEST_EXECUTOR: ${{ inputs.capture_executor || vars.CAPTURE_TEST_EXECUTOR || 'unified' }}
      CAPTURE_TEST_BYTECODE_CACHE: ${{ inputs.capture_bytecode_cache || vars.CAPTURE_TEST_BYTECODE_CACHE || 'auto' }}
      CAPTURE_TEST_IDENTITY_MEMO: ${{ inputs.capture_identity_memo || vars.CAPTURE_TEST_IDENTITY_MEMO || 'auto' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 采集工具与客户端控制的测试把受管临时根固定为 macOS 的 /private/tmp（与 ARM64 验证环境一致）；
      # Linux 运行器默认没有这个目录，不建会让这些测试以 FileNotFoundError 整批报错。
      - name: 建立受管临时根 /private/tmp
        run: sudo install -d -m 1777 /private/tmp
      # 受管验证环境（ARM64）是 root 用户、umask 022；GitHub 运行器是非 root 用户、umask 002，检出的文件是 0664。
      # 两处差异各让一个用例出错，这里让运行器在这两点上与验证环境一致：
      # ① managed_driver_module 与 test_missing_formal_contracts_never_fall_back_to_repository_code 用
      #    Path("/root/arm64-capture-driver").exists() 判断本机有没有受管驱动安装；/root 对非 root 不可遍历时，
      #    stat 抛 PermissionError 而不是返回 False。只给 /root 加「其他人可遍历」位，仍不能列目录。
      # ② 受管 reader 登记只认 0400/0444/0500/0555/0600/0644/0700/0755，0664/0775 会被判「前驱 reader 原模式非法」；
      #    把检出树去掉组与其他人的写位，得到与 umask 022 检出相同的 0644/0755（可执行位不变）。
      # ③ 运行器镜像构建时对 /opt 做了 chmod -R 777（actions/runner-images 的 configure-system.sh），预装在工具缓存里
      #    的 Python（标准库源码、字节码、扩展模块、解释器）会是 0777；受管 reader 的运行库登记逐个记录这些文件的
      #    原模式，0777 同样会被判「前驱 reader 原模式非法」。把 Python 安装树也去掉组与其他人的写位，得到 0755。
      #    （这一条是据镜像脚本的推断，规整前那次诊断打印的清单就是证据。）
      # 下面的诊断函数（只读，失败不影响作业）用受管 reader 自己的命令列出运行库登记，打印原模式不在允许集合里的
      # 文件：规整 Python 安装树前后各打一次，前一次留作根因证据，后一次应为 0 个；若不是 0，下一轮排查直接看清单。
      - name: 对齐受管验证环境（/root 可遍历、检出文件与 Python 安装树模式 0644/0755）
        run: |
          reader_mode_audit() {
            env -i LC_ALL=C PATH=/usr/bin:/bin "${pythonLocation}/bin/python" -I -B -S \
              tools/official_client_capture/claude_gate_material_worker.py \
              --runtime-manifest --repository "${GITHUB_WORKSPACE}" > "${RUNNER_TEMP}/reader-runtime.json" || return 0
            python -B -c '
          import json, sys
          allowed = {"0400", "0444", "0500", "0555", "0600", "0644", "0700", "0755"}
          rows = json.load(open(sys.argv[1]))["files"]
          bad = [row for row in rows if row["mode"] not in allowed]
          print("运行库登记文件数:", len(rows), " 模式不合规:", len(bad))
          for row in bad[:40]:
              print("  ", row["mode"], row["absolute_path"])
          ' "${RUNNER_TEMP}/reader-runtime.json"
          }
          sudo chmod o+x /root
          chmod -R go-w "${GITHUB_WORKSPACE}"
          echo "【规整 Python 安装树前】"
          reader_mode_audit || true
          sudo chmod -R go-w "${pythonLocation}"
          echo "【规整 Python 安装树后】"
          reader_mode_audit || true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked AST parser
        working-directory: frontend
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Capture test shard closure check
        run: make test-capture-tools-shard-check CAPTURE_TEST_SHARDS=4
      - name: Official client capture tool tests (shard ${{ matrix.shard }}/4)
        env:
          CAPTURE_TEST_OUT_DIR: ${{ runner.temp }}/capture-shard-${{ matrix.shard }}
        # umask 设为 022：测试夹具新建的文件与 ARM64 验证环境同为 0644，不随运行器默认的 002 变成 0664。
        run: |
          umask 022
          make test-capture-tools-shard CAPTURE_TEST_SHARDS=4 SHARD_INDEX=${{ matrix.shard }}
      - name: 保存分片身份、覆盖、结果与计时证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/capture-shard-${{ matrix.shard }}
          if-no-files-found: error

  egress-spec-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 获取冻结的上游基线标签
        run: |
          git fetch --no-tags https://github.com/Wei-Shaw/sub2api.git \
            refs/tags/v0.1.177:refs/tags/v0.1.177
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 采集工具与客户端控制的测试把受管临时根固定为 macOS 的 /private/tmp（与 ARM64 验证环境一致）；
      # Linux 运行器默认没有这个目录，不建会让这些测试以 FileNotFoundError 整批报错。
      - name: 建立受管临时根 /private/tmp
        run: sudo install -d -m 1777 /private/tmp
      - name: Codex 出站规格与封存门禁
        run: |
          default_branch="${{ github.event.repository.default_branch }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/${default_branch}" ]; then
            base_ref="${{ github.event.before }}"
          else
            git fetch --no-tags origin "$default_branch"
            base_ref="$(git rev-parse FETCH_HEAD)"
          fi
          if ! git rev-parse --verify "${base_ref}^{commit}" >/dev/null 2>&1; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          EGRESS_SEAL_BASE_REF="$base_ref" make check-egress-spec-ci

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    env:
      # golangci-lint 版本的唯一定义点：下面默认、unit、integration 三个步骤都引用它，不得再写字面版本。
      # 上游改 lint 版本时，合并解决冲突改的是这一行（tools/upstream_merge/toolchain.py 的用例会校验）。
      GOLANGCI_LINT_VERSION: v2.14.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=30m
          working-directory: backend
      # test job 用 -tags=unit、-tags=integration 编译测试，不带标签的 lint 看不到这两类
      # 测试文件；按同样的标签各补跑一次，让 lint 覆盖与测试集合对齐。
      - name: golangci-lint (unit)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=30m --build-tags=unit
          working-directory: backend
          skip-save-cache: true
      - name: golangci-lint (integration)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=30m --build-tags=integration
          working-directory: backend
          skip-save-cache: true

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
